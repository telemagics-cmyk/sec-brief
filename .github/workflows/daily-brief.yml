# 매일 아침 보안 브리핑: 수집 → 이력 커밋(data/) → 웹 이력 게시(GitHub Pages) → 카카오톡·메일 발송
#
# 필요한 설정 (README 참고)
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#   Settings > Secrets and variables > Actions
#     KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, KAKAO_REFRESH_TOKEN   카카오톡 발송
#     OUTLOOK_CLIENT_ID, OUTLOOK_REFRESH_TOKEN, MAIL_TO   (선택) Outlook.com 계정으로 메일 발송
#     SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM  (선택) 또는 SMTP(Gmail 등)로 메일 발송
#     ANTHROPIC_API_KEY   (선택) Claude 한국어 요약·번역
#     NVD_API_KEY         (선택) NVD 요청 한도 완화
#     NAVER_CLIENT_ID, NAVER_CLIENT_SECRET   (선택) 네이버 뉴스 검색
#   정시 실행: 외부 예약 서비스(cron-job.org)가 06:00·06:15 KST 에 이 워크플로를 API 로 부른다(README '정시에 받기')
#
# 액션은 공급망 위험을 줄이려고 커밋 해시로 고정했다(옆 주석이 버전).
name: daily-brief
run-name: ${{ github.event_name == 'schedule' && 'GitHub 예약 실행 (예비)' || inputs.scheduled && '정시 실행 (외부 호출)' || '직접 실행' }}

on:
  # 정시 실행은 외부 호출(workflow_dispatch, scheduled: true)이 맡는다. GitHub 예약은 붐비면 늦게 시작해서
  # (2026-10-25~28 실측: 매일 2~3.5시간) 외부 호출이 오지 않은 날을 위한 예비로 둔다.
  # 어느 실행이든 앞 실행이 이미 만들고 보냈으면 수집·발송을 건너뛰므로 같은 날 두 번 오지 않는다.
  schedule:
    - cron: '5 20 * * *' # 05:05 KST
    - cron: '35 21 * * *' # 06:35 KST
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 브리핑이 이미 있어도 다시 만들기'
        type: boolean
        default: false
      send:
        description: '카카오톡·메일 발송'
        type: choice
        options: ['보내기', '연결 확인 메시지만', '보내지 않기']
        default: '보내기'
      scheduled:
        description: '정시 실행처럼 발송 시각(06:30)까지 기다렸다 보내기 (외부 예약 호출용)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sec-brief
  cancel-in-progress: false

jobs:
  brief:
    name: 수집·이력 저장·웹 페이지
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      site_url: ${{ steps.url.outputs.site_url }}
    steps:
      # 예약 시각의 커밋이 아니라 지금의 최신 이력을 받는다(재시도가 앞 실행의 결과를 보도록)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pages 주소 확인
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
      - name: 사이트 주소 정하기
        id: url
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="${PAGES_URL:-https://${OWNER,,}.github.io/${REPO}}"
          echo "site_url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "사이트 주소: ${url%/}"

      - name: 수집·브리핑 작성
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '--scheduled' || '' }}
        run: node src/cli.mjs collect $FORCE $SCHEDULED

      - name: 이력 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo '바뀐 이력 없음'; exit 0; fi
          git commit -q -m "브리핑 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1

      - name: 웹 페이지 만들기
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
        run: node src/cli.mjs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: 웹 이력 게시
    needs: brief
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deliver:
    name: 발송 (카카오톡·메일)
    # 게시가 실패해도 메시지는 보낸다(링크는 다음 게시 때 열림)
    needs: [brief, deploy]
    if: ${{ always() && needs.brief.result == 'success' && (github.event_name == 'schedule' || inputs.send != '보내지 않기') }}
    runs-on: ubuntu-latest
    # 정시·예약 실행은 발송 시각(06:30)까지 기다릴 수 있다(그보다 110분 넘게 이르면 보내지 않고 끝냄)
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 발송
        env:
          SITE_URL: ${{ needs.brief.outputs.site_url }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MODE: ${{ inputs.send == '연결 확인 메시지만' && '--test' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          WAIT: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '--scheduled' || '' }}
        run: node src/cli.mjs send $MODE $FORCE $WAIT
      - name: 발송 기록 커밋
        # 새 카카오·Outlook 리프레시 토큰(암호화)·발송 기록을 잃지 않도록 발송이 실패해도 저장한다
        if: always()
        run: |
          files=""
          for f in data/kakao-state.json data/mail-state.json; do [ -f "$f" ] && files="$files $f"; done
          [ -n "$files" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $files
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "발송 기록 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
