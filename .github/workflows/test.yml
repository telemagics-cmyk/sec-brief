# 코드를 고쳐 올리면 시험을 돌린다 (매일 브리핑이 깨진 코드로 돌지 않게)
name: test

on:
  push:
    paths: ['src/**', 'test/**', 'config.json', 'package*.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
